<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Deutsche Deadlock Community">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield base -->
  <path d="M50,5 L89,20 L89,56 C89,76 72,89 50,97 C28,89 11,76 11,56 L11,20 Z"
        fill="url(#g)" filter="url(#glow)"/>

  <!-- Inner highlight rim -->
  <path d="M50,11 L83,24 L83,56 C83,73 68,84 50,91 C32,84 17,73 17,56 L17,24 Z"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- DDC text -->
  <text x="50" y="60"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="24"
        font-weight="800"
        letter-spacing="1.5"
        fill="white">DDC</text>
</svg>
