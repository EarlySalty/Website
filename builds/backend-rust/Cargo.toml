[package]
name = "ddc-website-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
constant_time_eq = "0.3"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
dl-central-db = { path = "../../../Deadlock-Bots/rust/crates/dl-central-db" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
dl-central-db = { path = "../../../Deadlock-Bots/rust/crates/dl-central-db", features = ["testing"] }
serial_test = "3"
tower = { version = "0.5", features = ["util"] }
