rules:
  - id: html.external-script-missing-sri
    languages: [generic]
    paths:
      include: ["*.html", "**/*.html"]
    message: External scripts require integrity and crossorigin attributes.
    severity: ERROR
    # Ausnahme nur fuer den Cloudflare-Beacon, und nur wenn er wirklich der
    # src-Host ist: Cloudflare tauscht beacon.min.js unangekuendigt aus, ein
    # fester integrity-Hash wuerde das Skript frueher oder spaeter blockieren.
    # Das Skript laeuft im Seitenkontext und hat damit Zugriff auf das DOM —
    # die Ausnahme ist ein bewusstes Zugestaendnis, kein risikofreier Fall.
    pattern-regex: >-
      (?i)<script\b(?![^>]*\bsrc\s*=\s*["'](?:https?:)?//static\.cloudflareinsights\.com/)(?=[^>]*\bsrc\s*=\s*["'](?:https?:)?//)(?!(?=[^>]*\bintegrity\s*=)(?=[^>]*\bcrossorigin\s*=))[^>]*>

  - id: html.external-stylesheet-missing-sri
    languages: [generic]
    paths:
      include: ["*.html", "**/*.html"]
    message: External stylesheets require integrity and crossorigin attributes.
    severity: ERROR
    pattern-regex: >-
      (?i)<link\b(?=[^>]*\brel\s*=\s*["'][^"']*\bstylesheet\b[^"']*["'])(?=[^>]*\bhref\s*=\s*["'](?:https?:)?//)(?!(?=[^>]*\bintegrity\s*=)(?=[^>]*\bcrossorigin\s*=))[^>]*>
