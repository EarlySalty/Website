rules:
  - id: html.external-script-missing-sri
    languages: [generic]
    paths:
      include: ["*.html", "**/*.html"]
    message: External scripts require integrity and crossorigin attributes.
    severity: ERROR
    # Externe ausführbare Skripte brauchen immer SRI. Auch bekannte Anbieter
    # sind keine Ausnahme: ohne pinbare Version lässt sich ein Hash nicht
    # dauerhaft und ausfallsicher betreiben, dann gehört das Skript nicht in
    # den Seitenkontext.
    pattern-regex: >-
      (?i)<script\b(?=[^>]*(?<![-\w])src\s*=\s*(?:["'](?:https?:)?//|(?!["'])(?:https?:)?//))(?!(?=[^>]*\bintegrity\s*=)(?=[^>]*\bcrossorigin\s*=))[^>]*>

  - id: html.external-stylesheet-missing-sri
    languages: [generic]
    paths:
      include: ["*.html", "**/*.html"]
    message: External stylesheets require integrity and crossorigin attributes.
    severity: ERROR
    pattern-regex: >-
      (?i)<link\b(?=[^>]*\brel\s*=\s*["'][^"']*\bstylesheet\b[^"']*["'])(?=[^>]*\bhref\s*=\s*["'](?:https?:)?//)(?!(?=[^>]*\bintegrity\s*=)(?=[^>]*\bcrossorigin\s*=))[^>]*>
