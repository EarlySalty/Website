title = "Website Gitleaks configuration"

[extend]
useDefault = true

# Cloudflare Web Analytics uses a public client-side site identifier that is
# intentionally embedded in delivered HTML. It is not an authentication
# credential and must remain consistent across all public pages.
[[allowlists]]
description = "Public Cloudflare Web Analytics site identifier"
regexTarget = "secret"
regexes = [
  '''^243469fbeb3f43d995584a9e2e779ca6$''',
]
