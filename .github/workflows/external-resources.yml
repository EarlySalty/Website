name: "🔒 Externe Web-Ressourcen"

# Baut die ausgelieferten HTML-Artefakte und verhindert ungesicherte externe
# Skripte/Stylesheets sowie die Rückkehr des nicht pinbaren RUM-Beacons.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  external-resources:
    name: "🔒 Externe Web-Ressourcen"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install pytest
        run: pip install pytest==9.1.1

      # Baut die Vite-Projekte, damit die Suite auch die ausgelieferten
      # Artefakte prueft und nicht nur die Quellen.
      - name: Build Vite-Projekte
        run: |
          for projekt in dl-landing dl-activity dl-patch dl-tierlist dl-coaching; do
            (cd "$projekt" && npm ci && npm run build)
          done

      - name: Ressourcen-Suite
        run: python3 -m pytest scripts/test_external_resources.py -v
