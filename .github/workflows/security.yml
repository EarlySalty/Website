name: "Security Scan"

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-detection:
    name: "Secret Detection"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Block tracked secret material files
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)(\.env(\..*)?|id_rsa|id_dsa|.*\.pem|.*\.key)$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Tracked secret material files detected:"
            echo "$forbidden"
            exit 1
          fi

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  python-security:
    name: "Python SAST + Dependency Audit"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run Bandit
        run: |
          bandit -r builds/backend dl-landing/mcp-server -ll -ii -f json -o bandit-report.json || true
          bandit -r builds/backend dl-landing/mcp-server -ll -ii -f sarif -o bandit.sarif || true

      - name: Upload Bandit report
        if: always() && hashFiles('bandit-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Upload Bandit SARIF
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Run pip-audit (builds/backend)
        run: pip-audit --strict --desc -r builds/backend/requirements.txt

      - name: License audit
        continue-on-error: true
        run: |
          pip install pip-licenses
          pip install -r builds/backend/requirements.txt -r dl-landing/mcp-server/requirements.txt
          pip-licenses --format=json --output-file=licenses.json
          python3 - <<'PY'
          import json, sys
          with open('licenses.json') as f:
              pkgs = json.load(f)
          blocklist = ['GPL-2.0', 'GPL-2.0-only', 'GPL-3.0', 'GPL-3.0-only', 'AGPL-3.0', 'AGPL-3.0-only']
          bad = [p for p in pkgs if any(b in (p.get('License') or '') for b in blocklist)]
          if bad:
              print('Copyleft-Lizenzen gefunden:')
              for p in bad:
                  print(f"  {p['Name']} {p['Version']}: {p['License']}")
              sys.exit(1)
          print(f'Lizenz-Audit OK: {len(pkgs)} Pakete geprüft, keine Copyleft-Lizenzen.')
          PY

      - name: Run pip-audit (dl-landing/mcp-server)
        run: pip-audit --strict --desc -r dl-landing/mcp-server/requirements.txt

  javascript-security:
    name: "JavaScript Dependency Audit (${{ matrix.project }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - builds/frontend
          - dl-landing
          - dl-activity
          - dl-patch
          - dl-tierlist
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: npm audit (${{ matrix.project }})
        working-directory: ${{ matrix.project }}
        run: |
          npm ci
          npm audit --audit-level=high

  semgrep-sast:
    name: "Semgrep SAST"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.151.0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/python \
            --exclude node_modules \
            --exclude .venv \
            --exclude venv \
            --output semgrep.sarif \
            --sarif

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  api-endpoint-inventory:
    name: "API Endpoint Inventory"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r builds/backend/requirements.txt

      - name: List and audit API routes
        working-directory: builds/backend
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          # Prevent lifespan DB init from running
          import unittest.mock as mock
          with mock.patch("app.database.init_db", return_value=None):
              from app.main import app

          routes = []
          for route in app.routes:
              if hasattr(route, "methods") and hasattr(route, "path"):
                  for method in sorted(route.methods):
                      routes.append((method, route.path))

          routes.sort()

          print("=== API Route Inventory ===")
          for method, path in routes:
              print(f"  {method:6} {path}")

          # Warnung bei Admin-Endpunkten ohne sichtbaren Auth-Schutz
          admin_routes = [(m, p) for m, p in routes if "/admin" in p]
          if admin_routes:
              print(f"\n::warning::Admin-Endpunkte vorhanden ({len(admin_routes)}) — Auth-Schutz manuell prüfen:")
              for method, path in admin_routes:
                  print(f"  {method} {path}")

          with open("api-routes.txt", "w") as f:
              f.write("\n".join(f"{m} {p}" for m, p in routes))
          print(f"\nGesamt: {len(routes)} Endpunkte")
          PY

      - name: Upload route inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-route-inventory
          path: builds/backend/api-routes.txt
          if-no-files-found: ignore
          retention-days: 90

  trivy-scan:
    name: "Trivy Filesystem Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: 0

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-filesystem'

      - name: Upload Trivy artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report
          path: trivy-fs.sarif
          if-no-files-found: ignore
          retention-days: 30
