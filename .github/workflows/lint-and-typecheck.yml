name: "🔍 Lint & Type Check"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-react:
    name: "🧪 Frontend React CI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: builds/frontend/package-lock.json

      - name: Install dependencies
        working-directory: builds/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: builds/frontend
        run: npm run lint

      - name: TypeScript type check
        working-directory: builds/frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: builds/frontend
        run: npm run build

  frontend-vite-projects:
    name: "🏗️ Vite Build (${{ matrix.project }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - dl-landing
          - dl-activity
          - dl-patch
          - dl-tierlist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.project }}
        run: npm run build
