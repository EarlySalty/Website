name: "🔍 Lint & Type Check"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-react:
    name: "🧪 Frontend React CI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: builds/frontend/package-lock.json

      - name: Install dependencies
        working-directory: builds/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: builds/frontend
        run: npm run lint

      - name: TypeScript type check
        working-directory: builds/frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: builds/frontend
        run: npm run build

  frontend-vite-projects:
    name: "🏗️ Vite Build (${{ matrix.project }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - dl-landing
          - dl-activity
          - dl-patch
          - dl-tierlist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.project }}
        run: npm run build

  analytics-beacon:
    name: "📈 Analytics-Beacon"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      # Baut die Vite-Projekte, damit die Suite auch die ausgelieferten
      # Artefakte prueft und nicht nur die Quellen.
      - name: Build Vite-Projekte
        run: |
          for projekt in dl-landing dl-activity dl-patch dl-tierlist dl-coaching; do
            (cd "$projekt" && npm ci && npm run build)
          done

      # Das Caddy-Repo liegt nicht im Checkout; die CSP-Faelle werden dort
      # uebersprungen und bleiben Sache der lokalen Deploy-Pruefung.
      - name: Beacon-Suite
        run: python3 -m pytest scripts/test_cf_analytics.py -v
