<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadlock Verlauf | Deutsche Deadlock Community</title>
    <meta
      name="description"
      content="Historie der öffentlichen Deadlock Tierliste mit Snapshots pro Skill-Bucket."
    />
    <meta property="og:title" content="Deadlock Verlauf | Deutsche Deadlock Community" />
    <meta
      property="og:description"
      content="Die letzten Snapshots der Deadlock Tierliste inklusive Tier- und Winrate-Entwicklung."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:image" content="https://deutsche-deadlock-community.de/images/og-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo der Deutschen Deadlock Community" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Deadlock Verlauf | Deutsche Deadlock Community" />
    <meta
      name="twitter:description"
      content="Timeline der letzten öffentlichen Tierlisten-Snapshots."
    />
    <meta name="twitter:image" content="https://deutsche-deadlock-community.de/images/og-logo.png" />
    <meta name="tierlist-api-base" content="/builds" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/brand/tokens.css" />
    <link rel="stylesheet" href="/brand/nav.css" />
    <script src="/brand/nav.js" defer></script>
    <script type="module" src="/src/history.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="/" aria-label="Deutsche Deadlock Community">
          <img src="/brand/logo/logo-192.png" alt="" class="brand-logo" />
          <span class="brand-copy">
            <img src="/brand/logo/wordmark.svg" alt="" class="brand-wordmark-img" />
            <span class="brand-subtitle">Tierlist-Verlauf</span>
          </span>
        </a>

        <nav class="site-nav" aria-label="Hauptnavigation">
          <a href="/builds/">Tierliste</a>
          <a href="/builds/history/" class="is-active" aria-current="page">Verlauf</a>
          <a href="/builds/admin/">Admin</a>
        </nav>

        <label class="header-field" for="history-bucket-select">
          <span class="header-field__label">Skill Bucket</span>
          <select id="history-bucket-select" class="select-control">
            <option value="all">All Skill</option>
            <option value="phantom_plus">Phantom+</option>
            <option value="eternus">Eternus</option>
          </select>
        </label>
      </div>
    </header>

    <main class="history-page">
      <div class="container page-stack">
        <section class="hero-surface hero-surface--history">
          <div class="hero-surface__copy">
            <p class="eyebrow">Snapshot Timeline</p>
            <h1>Tierlisten-Verlauf</h1>
            <p class="hero-surface__text">
              Die letzten 30 Snapshots mit Winrates und Tier-Zuordnung pro Hero.
            </p>
          </div>
        </section>

        <div id="history-container" class="history-shell" aria-live="polite">
          <div class="loading-state">Lade Verlauf…</div>
        </div>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <footer class="footer">
      <div class="container">© <span id="year"></span> Deutsche Deadlock Community</div>
    </footer>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "243469fbeb3f43d995584a9e2e779ca6"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
