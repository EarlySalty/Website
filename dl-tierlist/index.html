<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tier-Liste | Deutsche Deadlock Community</title>
    <meta
      name="description"
      content="Aktuelle Deadlock Tier-Liste der Deutschen Deadlock Community mit Meta-Einschaetzungen und Hero-Rankings."

    <meta property="og:title" content="Tier-Liste | Deutsche Deadlock Community" />
    <meta
      property="og:description"
      content="Die aktuelle Deadlock Tier-Liste der Deutschen Deadlock Community auf einen Blick."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />

    <header class="site-header">
      <div class="container">
        <a class="brand" href="/">
          <span class="brand-mark">Deadlock Meta</span>
          <span class="brand-subtitle">DE Community</span>
