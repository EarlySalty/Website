<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadlock Tierliste | Deutsche Deadlock Community</title>
    <meta
      name="description"
      content="Automatische Deadlock Tierliste der Deutschen Deadlock Community mit Winrates, Build-Empfehlungen und Hero-Details."
    />
    <meta property="og:title" content="Deadlock Tierliste | Deutsche Deadlock Community" />
    <meta
      property="og:description"
      content="Aktuelle Deadlock Tierliste mit Patch-Stand, Winrates und empfohlenen Builds."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:image" content="https://deutsche-deadlock-community.de/images/og-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo der Deutschen Deadlock Community" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Deadlock Tierliste | Deutsche Deadlock Community" />
    <meta
      name="twitter:description"
      content="Die aktuelle Meta der Deadlock Heroes auf einen Blick."
    />
    <meta name="twitter:image" content="https://deutsche-deadlock-community.de/images/og-logo.png" />
    <meta name="tierlist-api-base" content="/builds" />
    <link rel="icon" type="image/png" href="/brand/logo/favicon-64.png">
    <link rel="stylesheet" href="/brand/tokens.css" />
    <link rel="stylesheet" href="/brand/nav.css" />
    <script src="/brand/nav.js" defer></script>
    <script type="module" src="/src/tierlist.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="/" aria-label="Deutsche Deadlock Community">
          <img src="/brand/logo/logo-192.png" alt="" class="brand-logo" />
          <span class="brand-copy">
            <img src="/brand/logo/wordmark.svg" alt="" class="brand-wordmark-img" />
            <span class="brand-subtitle">
              Patch <span id="patch-date">—</span> · aktualisiert <span id="last-updated-date">—</span>
            </span>
          </span>
        </a>

        <nav class="site-nav" aria-label="Hauptnavigation">
          <a href="/builds/" class="is-active" aria-current="page">Tierliste</a>
          <a href="/builds/history/">Verlauf</a>
          <a href="/builds/admin/">Admin</a>
        </nav>

        <label class="header-field" for="bucket-select">
          <span class="header-field__label">Skill</span>
          <select id="bucket-select" class="select-control">
            <option value="all">All Skill</option>
            <option value="phantom_plus">Phantom+</option>
            <option value="eternus">Eternus</option>
          </select>
        </label>
      </div>
    </header>

    <main class="tier-page">
      <div class="container page-stack">
        <section class="toolbar" aria-label="Filter und Ansicht">
          <input
            id="hero-search"
            class="text-control toolbar__search"
            type="search"
            placeholder="Hero suchen…"
            autocomplete="off"
          />

          <div class="view-toggle" role="group" aria-label="Ansicht wechseln">
            <button
              id="view-grid"
              class="view-toggle__button is-active"
              type="button"
              data-view-mode="grid"
            >
              Grid
            </button>
            <button id="view-list" class="view-toggle__button" type="button" data-view-mode="list">
              List
            </button>
          </div>
        </section>

        <div id="tierlist-container" class="tierlist-shell" aria-live="polite">
          <div class="loading-state">Lade Tierliste…</div>
        </div>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <footer class="footer">
      <div class="container">© <span id="year"></span> Deutsche Deadlock Community</div>
    </footer>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "243469fbeb3f43d995584a9e2e779ca6"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
